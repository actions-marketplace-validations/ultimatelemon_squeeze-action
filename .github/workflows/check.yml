name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    # Public repo: GitHub-hosted runners only, never the self-hosted runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck push.sh
      - uses: raven-actions/actionlint@v2

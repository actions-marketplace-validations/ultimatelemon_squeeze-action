name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # Public repo: GitHub-hosted runners only, never the self-hosted runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck push.sh
      - uses: raven-actions/actionlint@v2
